<html lang="en"> <!-- linguagem em inglês-->
<head> <!-- cabeçario - informaçoes do arquivo HTML -->
    <meta charset="UTF-8"> <!--mapa universal dos caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--tamanho do dispostivo-->
    <title>Tópico 1</title>
    <!-- script do tipo java script-->

</head>
<body> <!-- corpo digitar os documentos, texto, imagens, cores, odernação e alinhamento-->
  <!-- div - uma abreviação de uma região - delimitando uma região-->
    <div>Programação de Interfaces (aula1)</div>
    <script type="text/javascript">
        //Define valores iniciais.
        var a = 10, b = 20, c = 30;
        //Realiza operações matemáticas básicas
        var somar = a + b;
        var subtrair = a - b;
        var mult = a * b;
        var dividir = a/b;
        //Exibe resultados na página.
        document.write("<br>a = " + a + " | b = " + b + " | c = " + c+ "<br>");
        document.write("<br>somar (a+b) = " + somar);
        document.write("<br>subtrair (a-b) = " + subtrair);
        document.write("<br>multiplicar (a*b) = " + mult);
        document.write("<br>dividir (a/b) = " + dividir);
        document.write("<br>(a/(a+c)) = " + a/(a+c));
        document.write("<br>(b*a) /(a+c) = " + (b*a)/(a*c));
    </script>
</body>
</html>
